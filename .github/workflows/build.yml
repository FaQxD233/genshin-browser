name: CI and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example: v0.2.1)"
        required: true
        default: "v0.2.1"
      create_release:
        description: "Create GitHub Release"
        required: true
        type: boolean
        default: true
      bundle_webview2:
        description: "Also build the full package with bundled WebView2 (fixed version)"
        required: true
        type: boolean
        default: true
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: ""
      run_quality_only:
        description: "Only build/test/format (skip publish)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/GenshinBrowser.Tests/GenshinBrowser.Tests.csproj -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test tests/GenshinBrowser.Tests/GenshinBrowser.Tests.csproj -c Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true

      - name: Verify formatting
        run: |
          dotnet format GenshinBrowser.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format tests/GenshinBrowser.Tests/GenshinBrowser.Tests.csproj --verify-no-changes --no-restore --verbosity minimal

  release:
    name: Publish win-x64
    if: ${{ !inputs.run_quality_only }}
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if ($version -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$') {
              throw "Invalid version '$version'. Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix."
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_SEMVER=$($version.Substring(1))" >> $env:GITHUB_ENV

      - name: Restore win-x64 runtime
        run: dotnet restore GenshinBrowser.csproj -r win-x64 -p:TreatWarningsAsErrors=true

      # 与本地发布同一个脚本：发布、加 Evergreen 安装程序 / 内置固定版本运行时、两种包的自检
      - name: Publish and verify packages
        shell: pwsh
        env:
          BUNDLE_WEBVIEW2: ${{ inputs.bundle_webview2 }}
        run: |
          ./release/publish-win-x64.ps1 `
            -Version $env:RELEASE_VERSION `
            -NoRestore `
            -BundleWebView2:($env:BUNDLE_WEBVIEW2 -eq 'true') `
            -WebView2CacheDirectory $env:RUNNER_TEMP

          $webView2Version = (Get-Content -LiteralPath release/webview2-fixed-runtime.json -Raw | ConvertFrom-Json).version
          "WEBVIEW2_FIXED_VERSION=$webView2Version" >> $env:GITHUB_ENV

      - name: Package release
        shell: pwsh
        run: |
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $packages = @(
              @{ Path = "dist/win-x64-self-contained"; Zip = "GenshinBrowser-$env:RELEASE_VERSION-win-x64.zip"; Edition = "standard"; WebView2 = "system WebView2 Runtime (Evergreen)" }
              @{ Path = "dist/win-x64-full"; Zip = "GenshinBrowser-$env:RELEASE_VERSION-win-x64-full.zip"; Edition = "full"; WebView2 = "bundled fixed version $env:WEBVIEW2_FIXED_VERSION" }
          )

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          foreach ($package in @($packages | Where-Object { Test-Path -LiteralPath $_.Path })) {
              $info = @(
                  "Genshin Browser - Windows x64 self-contained ($($package.Edition))"
                  "Version: $env:RELEASE_VERSION"
                  "WebView2: $($package.WebView2)"
                  "Build time: $buildTime"
                  "Commit: $env:GITHUB_SHA"
                  "Branch: $env:GITHUB_REF_NAME"
              ) -join "`n"
              $info | Out-File -FilePath (Join-Path $package.Path "VERSION.txt") -Encoding utf8
              Write-Host $info

              $zipPath = Join-Path "release-assets" $package.Zip
              Compress-Archive -Path "$($package.Path)/*" -DestinationPath $zipPath -CompressionLevel Optimal
              $checksum = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
              "$checksum  $($package.Zip)" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii
              $size = [math]::Round((Get-Item -LiteralPath $zipPath).Length / 1MB, 2)
              Write-Host "Created $($package.Zip): $size MiB"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinBrowser-${{ inputs.version }}-win-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Genshin Browser ${{ env.RELEASE_VERSION }}
          body: |
            ## Genshin Browser ${{ env.RELEASE_VERSION }}

            专为 B 站原神攻略视频设计的 Windows 浮窗浏览器。

            ### 下载说明

            - `GenshinBrowser-${{ env.RELEASE_VERSION }}-win-x64.zip`（标准版）：使用系统里的 WebView2 运行时，没有安装时首次启动会自动静默安装。
            ${{ inputs.bundle_webview2 && format('- `GenshinBrowser-{0}-win-x64-full.zip`（完整版）：内置 WebView2 运行时（固定版本 {1}），不依赖系统里的 WebView2，系统更新也不会改变它的行为；下载包较大。', env.RELEASE_VERSION, env.WEBVIEW2_FIXED_VERSION) || '' }}

            解压后运行 `GenshinBrowser.exe`。

            **系统要求：** Windows 10/11 x64

            ### 本次更新

            ${{ inputs.release_notes }}

            **编译信息**

            - 提交：`${{ github.sha }}`
            - 分支：`${{ github.ref_name }}`
            - 工作流：`${{ github.run_id }}`
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_SEMVER, '-') }}

      - name: Write job summary
        shell: pwsh
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          "## Genshin Browser $env:RELEASE_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          foreach ($asset in @(Get-ChildItem -LiteralPath release-assets -File)) {
              "- ``$($asset.Name)``: $([math]::Round($asset.Length / 1MB, 2)) MiB" >> $env:GITHUB_STEP_SUMMARY
          }
          "- GitHub Release: ``$env:CREATE_RELEASE``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
